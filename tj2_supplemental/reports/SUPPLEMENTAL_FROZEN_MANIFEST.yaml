    - {scan_range: [143, 197], n: 55,  range_m: [14.31, 15.69]}
    - {scan_range: [238, 510], n: 273, range_m: [9.11, 13.47]}
    - {scan_range: [602, 701], n: 100, range_m: [8.54, 9.12]}
  selection_basis: >
    Rule 1 selects II outright (428 > 371 > 313; ratios 0.867/0.731 < 0.90, not close).
    Rules 2 and 3 independently also favor II (3 separated temporal blocks and 5/10 deciles
    vs single contiguous segments for I/III; all 6 VI orientation blocks; smallest zip).
    Screen implementation bitwise-reproduces TJ1 frozen support flags (IV IN=156, V IN=0).

