# ----------------------------------------------------------- frozen geometry / objectives / nuisance
data_convention:
  lidar_3d: "ASCII 'x y z' metres, LIDAR frame"
  pose: "line1 timestamp s; line2 pos target-in-lidar [m]; line3 quaternion [qs qx qy qz] scalar-first target->lidar"
  gt_align: "P_target = R^T (P_lidar - t), R=quat_to_R(q)"
  view: "sensor origin in target frame o=-R^T t ; range=||o|| ; u=o/||o||"
patches: {n_patches: 24, re_cluster_on_II: false, label_policy: "frozen model-patch label of NN model point"}
objectives:
  J1_p2p: "mean_i || T p_i - m_nn(Tp_i) ||^2 ; NN recomputed every evaluation"
  J2_p2l: "mean_i [ n_nn^T (T p_i - m_nn) ]^2 ; frozen PCA normals k=16"
  forbidden: [robust_loss, trimmed_ICP, tukey, huber, outlier_rejection, new_ICP, NDT, neural, learned_correction]
finite_difference: {translation_step_m: 0.005, rotation_step_deg: 0.25, hessian: symmetric_central_difference}
local_basin: {translation_m: 0.30, rotation_deg: 15.0, start: AT_GT, clip_rule: basin_clipped_first_exit, on_bound_reported: true}
nuisance:
  primary_controls: [RAW, N1_range_offset, N2_shared_SE3, N3_isotropic_scale]
  apply_frozen_values_only: true       # frozen_nuisance_ops.npz (br,s,Rse,tse); never refit on II
  N1_range_offset_br_mm: 58.33183260641035
  N2_shared_SE3: {t_mm: [45.66629212343002, -0.9635487866922601, -5.76328782085703], rot_deg: 2.413620127899284, scope: one_shared_never_per_scan}
  N3_isotropic_scale: {s: 0.9655788069097739, scale_pct: -3.4421193090226065}
  N4: OVER_PARAMETERIZED_STRESS_ONLY_NOT_PRIMARY

# ----------------------------------------------------------- P1 / P2 / P3 (frozen, reuse TJ1 code path)
protocols:
  P1_GT_objective_stationarity:
    measure: "||grad J(T_GT)|| real vs model-self numerical null (self = same # random MODEL points, seed42); Hotelling T2; gradient direction concentration"
    report_conditions: [raw, N1, N2, N3]
    report_objectives: [p2p, p2l]
  P2_GT_started_local_optimum_displacement:
    measure: "ICP p2p (Kabsch) / linearized p2l Gauss-Newton started AT GT, basin-clipped 0.30m/15deg; L-BFGS-B cross-check; report xi*, |dt|, |dr|, sign consistency, on-bound fraction"
    report_conditions: [raw, N1, N2, N3]
  P3_VI_only_frozen_direction:
    inputs: "VI frozen template (Vmean/Vcnt) + II GT view geometry + nominal CAD ONLY; II current-frame residual FORBIDDEN"
    predicted_cloud: "Qhat_i = m_nn(i) + mu_{j(i)}(z_II)"
    predicted_step: "dxi_hat = -pinv(H_nom) ghat ; H_nom on nominal support cloud (no II residual); numpy pinv default rcond"
    observed_step: "P2 raw xi* (GT-started local optimum)"
    primary_endpoint: p2p_translation_direction_cosine
    secondary_endpoint: p2l_translation_direction_cosine   # confirmatory only, cannot replace p2p
    supporting: "-D1 template-direction cosine (not a gate)"
    magnitude: NOT_A_GATE_THIS_ROUND

# ----------------------------------------------------------- statistics (frozen) + larger-block sensitivity
statistics:
  block_bootstrap:
    method: moving_block_bootstrap_of_scan_level_statistic   # identical to r10 mb_median
    primary_block_length_L: 5            # VI-derived, used in TJ1 IV/V
    B: 2000
    seed: 42
    statistic: median_cosine
    ci: [2.5, 97.5]
  larger_block_length_sensitivity: {also_report_L: [10, 20], purpose: "show primary verdict is stable at larger block lengths", required_report: true}
  vector_pairing_permutation:
    B: 2000
    seed: 42
    null: "shuffle observed-step vectors relative to predicted-step vectors across scans"
    p_value: "(1 + #{null_median >= obs_median})/(B+1)"
  analysis_set: IN_SUPPORT_only_for_primary_confirmatory   # 428 planned; OUT/all reported as appendix only
  report_required: [N_IN_SUPPORT, support_temporal_blocks, block_length_sensitivity, per_block_results]

# ----------------------------------------------------------- frozen success / failure gate (external gate, unchanged)
gate:
  applies_to: P3_p2p_IN_SUPPORT_raw
  all_four_required:
    median_cosine_min: 0.60
    block_bootstrap_ci95_lower_gt: 0
    frac_cosine_positive_min: 0.70
    vector_pairing_permutation_p_max: 0.01
  p2l: confirmatory_secondary_must_not_replace_p2p
  magnitude_gate: none
  alpha_refit: forbidden
on_pass:
  status: GO_TOP_JOURNAL_MECHANISM_CANDIDATE
  evidence_chain: "VI internal non-circular PASS + IV confirmatory external PASS + one prospectively selected supplemental external (Dataset II) PASS + V supportive OUT-OF-SUPPORT extrapolation"
  historical_record_unchanged: "original TJ1-E on Dataset V = NOT EVALUABLE because V had zero frozen-support samples (range 2.8-7.8 m non-overlapping VI 8.75-14.8 m)"
on_fail:
  status: PARTIAL_EXTERNAL_REPLICATION
  action: "report failure as mechanism transfer boundary; DO NOT open/test Dataset I or III; no sequential fishing for a positive"
on_insufficient_coverage:
  trigger: "I/II/III all lack adequate frozen-support coverage (NOT the case: II n=428, 3 blocks, 6 orient blocks)"
  action: "download no point clouds; stay PARTIAL_EXTERNAL_REPLICATION; proceed to paper writing; stop enlarging EPOS-Lid"
