selection:
  rule_1_primary: maximize_N_IN_SUPPORT
  closeness_for_tiebreak: "next-best N >= 0.90 * best N (relative gap <=10%)"
  rule_2_on_tie: prefer_more_independent_temporal_and_orientation_blocks_not_one_contiguous_segment
  rule_3_still_tied: smallest_download_bytes
  forbidden_selection_inputs: [predicted_cosine, residual_quality, expected_positive_ease, any_registration_outcome]
  candidates:
    Dataset_I:   {zip_bytes: 194066093, n_scans: 2483, N_IN_SUPPORT: 313, frac: 0.1261,
                  n_temporal_blocks: 1, temporal_deciles_hit: 2, vi_orientation_blocks_hit: 2,
                  in_support_range_m: [14.809, 14.891]}
    Dataset_II:  {zip_bytes: 89932451,  n_scans: 1253, N_IN_SUPPORT: 428, frac: 0.3416,
                  n_temporal_blocks: 3, temporal_deciles_hit: 5, vi_orientation_blocks_hit: 6,
                  in_support_range_m: [8.545, 15.691]}
    Dataset_III: {zip_bytes: 94194038,  n_scans: 1302, N_IN_SUPPORT: 371, frac: 0.2849,
                  n_temporal_blocks: 1, temporal_deciles_hit: 4, vi_orientation_blocks_hit: 6,
                  in_support_range_m: [8.250, 15.464]}
  ratios_vs_best: {III_over_II: 0.867, I_over_II: 0.731}   # both < 0.90 -> rule 1 alone decisive
  selected_trajectory: Dataset_II
  selected_remote_zip: epos_dataset_ii.zip
  selected_zip_bytes_expected: 89932451
  selected_n_scans_expected: 1253
  selected_planned_in_support_scans: 428
