# TJ2 - SUPPLEMENTAL EXTERNAL CONFIRMATORY REPLICATION (prospectively frozen)
# Written 2026-09-09 (Asia/Shanghai; UTC 2026-09-09T12:09Z) AFTER metadata screen + selection,
# BEFORE any Dataset II point-cloud (".3d") byte is downloaded. Nothing frozen here may be
# changed after the Dataset II outcome is opened. Inherits ALL locks of
# structured_mismatch_phase0/reports/FROZEN_REPLICATION_MANIFEST.yaml (no override).

meta:
  tj: TJ2
  name: SUPPLEMENTAL_EXTERNAL_CONFIRMATORY_REPLICATION
  inherited_status_on_entry: PARTIAL_EXTERNAL_REPLICATION   # MUST stay unless the single test PASSES
  rng_seed: 42
  rng_library: numpy.default_rng(42)
  language_stack: {python: "3.14.7", numpy: "2.5.3", scipy: "1.18.1", pandas: "3.0.5"}
  single_outcome_bearing_test: true      # exactly ONE trajectory (II) may be opened for outcome
  never_test_even_on_failure: [Dataset_I, Dataset_III]
  ordering: "metadata screen -> selection (SUPPLEMENTAL_SELECTION.md) -> THIS manifest -> download II .3d -> P1/P2 -> P3 -> gate"

