  k_nearest_views: 16            # chosen inside VI (grid 8/16/32/64 -> 0.937/0.940/0.931/0.898)
  range_std_m: 2.0643
  tau_support: 0.4403            # 95th pct VI leave-block-out nearest-training distance
  alpha_VI_raw_p2p: 0.0200       # single through-origin magnitude scalar, VI-only
  nc0_primary: {protocol: A_embargo10, cond_obj: "raw|p2p", median_cos: 0.940,
                block_ci95: [0.929, 0.948], frac_positive: 1.00, perm_p: 0.0005,
                protocol_B_median_cos: 0.940, verdict: PASS}
  locked_before_IVV: true

deliverables:
  reports: [STATUS_LEDGER_FINAL.md, FROZEN_REPLICATION_MANIFEST.yaml, VI_NONCIRCULAR_VALIDATION.md, IV_REPLICATION.md, V_REPLICATION.md, EXTERNAL_NONCIRCULAR_PREDICTION.md, PATCH_TRANSFER.md, QUADRATIC_TRANSFER.md, TOP_JOURNAL_GATE_FINAL.md]
  csv: [vi_noncircular.csv, iv_prediction.csv, v_prediction.csv, patch_transfer.csv, trajectory_summary.csv]
